<!DOCTYPE html>
<html>
<head>
    <title>Country and Capital</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        select {
            padding: 8px;
            font-size: 16px;
        }

        .capital-style {
            color: blue;
            font-weight: bold;
            font-size: 22px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>Select a Country</h2>

    <select id="country" onchange="showCapital()">
        <option value="">--Select Country--</option>
        <option value="India">India</option>
        <option value="USA">USA</option>
        <option value="UK">UK</option>
        <option value="Japan">Japan</option>
        <option value="Australia">Australia</option>
    </select>

    <p id="capitalDisplay" class="capital-style"></p>

    <script>
        function showCapital() {
            var country = document.getElementById("country").value;
            var capitalText = "";

            if (country === "India") capitalText = "Capital: New Delhi";
            else if (country === "USA") capitalText = "Capital: Washington, D.C.";
            else if (country === "UK") capitalText = "Capital: London";
            else if (country === "Japan") capitalText = "Capital: Tokyo";
            else if (country === "Australia") capitalText = "Capital: Canberra";

            document.getElementById("capitalDisplay").innerText = capitalText;
        }
    </script>

</body>
</html>
