<!DOCTYPE html>
<html ng-app="emailApp">
<head>
    <title>Email Validation</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="emailController">

    <form name="emailForm">
        
        <label>Enter Email:</label>
        <input type="email" name="email" ng-model="userEmail" required>

        <br><br>

       
        <span ng-show="emailForm.email.$dirty && emailForm.email.$invalid">
            Invalid Email Address
        </span>

        <br><br>

        
        <span ng-show="emailForm.email.$valid">
            Valid Email 
        </span>

    </form>

    <script>
        var app = angular.module("emailApp", []);

        app.controller("emailController", function($scope) {
            $scope.userEmail = "";
        });
    </script>

</body>
</html>
