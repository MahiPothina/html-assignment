<html>
<head>
<title>Catalogue</title>
<style>
body{
font-family:Arial;
background:#f4f4f4;
margin:0;
padding:20px;
}

h2{
text-align:center;
color:#333;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th{
background:#2c3e50;
color:white;
padding:10px;
}

td{
padding:10px;
text-align:center;
border-bottom:1px solid #ccc;
}

tr:hover{
background:#f1f1f1;
}
</style>
</head>

<body>

<h2>Product Catalogue</h2>

<table>
<tr>
<th>Product</th>
<th>Price</th>
<th>Description</th>
</tr>

<tr>
<td>Web Design Course</td>
<td>₹2000</td>
<td>Learn HTML, CSS, JavaScript</td>
</tr>

<tr>
<td>Java Programming</td>
<td>₹2500</td>
<td>Core and Advanced Java</td>
</tr>

<tr>
<td>Python Course</td>
<td>₹2200</td>
<td>Data Science Basics</td>
</tr>

</table>

</body>
</html>
